name: release

# Publishes wesley-typescript-syntax to crates.io from an annotated tag on
# main. RELEASING.md describes the procedure. Each job needs the one before:
# gate -> publish (approved in the crates-io environment) -> verify ->
# github-release. wesley-emit-typescript has `publish = false` and is never
# published from here (flyingrobots/wesley#882).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CRATE: wesley-typescript-syntax
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Refuse a ref that is not a v* tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::release runs only from a tag; ${GITHUB_REF} is a ${GITHUB_REF_TYPE}"
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *)
              echo "::error::tag ${GITHUB_REF_NAME} does not start with v"
              exit 1
              ;;
          esac
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the tag object and main
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
      - name: Refuse a lightweight tag
        run: |
          kind="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          if [ "$kind" != tag ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag (${kind}); create it with git tag -a"
            exit 1
          fi
      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "refs/tags/${GITHUB_REF_NAME}^{commit}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not an ancestor of origin/main"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Refuse a tag that does not match the crate version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg crate "$CRATE" '.packages[] | select(.name == $crate) | .version')"
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is version ${version}, but ${CRATE} is ${manifest}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Refuse a version with no changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -E '^## \[' CHANGELOG.md | grep -qF "## [${VERSION}]"; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' heading"
            exit 1
          fi
      # The TypeScript compiler check (crates/wesley-typescript-syntax/tests/tsc.rs)
      # runs tsc through npx; with CI set, a missing npx fails the test.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo publish --dry-run --locked -p "$CRATE"

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Skip when this version is already on crates.io
        id: published
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if cargo info "${CRATE}@${VERSION}" --registry crates-io; then
            echo "${CRATE} ${VERSION} is already on crates.io; not publishing it again"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to crates.io
        if: steps.published.outputs.already != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p "$CRATE"

  verify:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Wait for crates.io to serve the version
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            if cargo info "${CRATE}@${VERSION}" --registry crates-io; then
              exit 0
            fi
            echo "attempt ${attempt}/20: ${CRATE} ${VERSION} is not served yet"
            sleep 15
          done
          echo "::error::${CRATE} ${VERSION} was not served by crates.io after 20 attempts"
          exit 1
      - name: Build a scratch crate on the published version
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          cargo new --quiet --bin release-check
          cd release-check
          cargo add --quiet "${CRATE}@=${VERSION}"
          cat > src/main.rs <<'RUST'
          use wesley_typescript_syntax::{print_module, Declaration, Module, Property, TsType};

          fn main() {
              let module = Module {
                  doc: Some("Release check.".to_owned()),
                  declarations: vec![
                      Declaration::Interface {
                          name: "Started".to_owned(),
                          doc: Some("A run started.".to_owned()),
                          properties: vec![
                              Property {
                                  name: "event".to_owned(),
                                  optional: false,
                                  readonly: true,
                                  ty: TsType::StringLiteral("started".to_owned()),
                                  doc: None,
                              },
                              Property {
                                  name: "what-ran".to_owned(),
                                  optional: true,
                                  readonly: false,
                                  ty: TsType::Array(Box::new(TsType::String)),
                                  doc: Some("The steps that ran.".to_owned()),
                              },
                          ],
                      },
                      Declaration::TypeAlias {
                          name: "Event".to_owned(),
                          doc: None,
                          ty: TsType::Union(vec![TsType::Ref("Started".to_owned()), TsType::Null]),
                      },
                  ],
              };
              print!("{}", print_module(&module).expect("the module prints"));
          }
          RUST
          cargo run --quiet > release-check.ts
          cat release-check.ts
          grep -q '^export interface Started' release-check.ts
          grep -q '^export type Event' release-check.ts
      - name: Type-check the printed module with tsc
        working-directory: ${{ runner.temp }}/release-check
        run: npx --yes -p typescript@5 tsc --noEmit --strict release-check.ts

  github-release:
    needs: [gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create the GitHub release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          notes="${RUNNER_TEMP}/notes.md"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::the CHANGELOG.md section for ${VERSION} is empty"
            exit 1
          fi
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${CRATE} ${VERSION}" \
            --notes-file "$notes" \
            "${prerelease[@]}"
