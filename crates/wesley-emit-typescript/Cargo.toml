[package]
name = "wesley-emit-typescript"
version = "0.3.0-alpha.4"
edition = "2021"
description = "TypeScript syntax-model emitter for Wesley IR"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/flyingrobots/wesley-typescript"
homepage = "https://github.com/flyingrobots/wesley-typescript#readme"
documentation = "https://docs.rs/wesley-emit-typescript"
keywords = ["graphql", "compiler", "typescript", "codegen"]
categories = ["compilers"]
# Not published from this repository yet. wesley-emit-typescript 0.3.0-alpha.4
# on crates.io was published from flyingrobots/wesley, and its next release
# belongs to flyingrobots/wesley#882, which moves its publishing here. Until
# then the release workflow can only publish wesley-typescript-syntax.
publish = false

[dependencies]
serde_json = "1.0"
wesley-core = "=0.3.0-alpha.4"
wesley-emit-codec = "=0.3.0-alpha.4"

[dev-dependencies]
pretty_assertions = "1.4"
